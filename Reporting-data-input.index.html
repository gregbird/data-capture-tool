<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecology Project Management Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
        .project-card, .section-card { transition: all 0.3s ease-in-out; }
        .project-card:hover, .section-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .data-entry-card { border-left: 4px solid #3b82f6; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 50; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); max-width: 95%; width: 500px; }
        #report-modal-content { width: 8.5in; max-width: 95%; height: 90vh; }
        #report-output { font-family: 'Times New Roman', serif; }
        @media print {
            body * { visibility: hidden; }
            #report-modal-content, #report-modal-content * { visibility: visible; }
            #report-modal-content { position: absolute; left: 0; top: 0; width: 100%; }
            #report-controls { display: none; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="app" class="container mx-auto p-4 md:p-8 max-w-7xl">

        <!-- Project List View -->
        <div id="project-list-view" class="view active">
            <header class="text-center mb-10">
                <h1 class="text-4xl font-bold text-gray-900">Ecology Projects</h1>
                <p class="text-lg text-gray-600 mt-2">Select a project or create a new one.</p>
            </header>
            <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Projects will be loaded here -->
            </div>
            <div class="text-center mt-8">
                <button onclick="app.showView('project-setup-view')" class="bg-green-600 text-white px-8 py-3 rounded-lg shadow-lg hover:bg-green-700 transition transform hover:scale-105">
                    + Create New Project
                </button>
            </div>
        </div>

        <!-- Project Setup View -->
        <div id="project-setup-view" class="view">
             <header class="text-center mb-10">
                <h1 class="text-4xl font-bold text-gray-900">New Project Setup</h1>
            </header>
            <div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
                <div class="space-y-4">
                    <input id="project-name" class="w-full p-3 border rounded-md" placeholder="Project Name (e.g., Torc Mountain Trail Upgrade)">
                    <input id="project-location" class="w-full p-3 border rounded-md" placeholder="Project Location (e.g., Killarney National Park)">
                    <textarea id="project-desc" class="w-full p-3 border rounded-md" rows="4" placeholder="Brief Project Description"></textarea>
                    <div>
                        <label for="report-type" class="block text-sm font-medium text-gray-700">Report Type</label>
                        <select id="report-type" class="w-full p-3 border rounded-md bg-white">
                            <option value="EIA">Ecological Impact Assessment (EcIA)</option>
                            <option value="PEAR">Preliminary Ecological Appraisal Report (PEAR)</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-between">
                    <button onclick="app.showView('project-list-view')" class="bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600">Cancel</button>
                    <button onclick="app.createProject()" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700">Save Project</button>
                </div>
            </div>
        </div>

        <!-- Data Capture View -->
        <div id="data-capture-view" class="view">
            <header class="mb-8">
                <button onclick="app.goHome()" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 mb-4">← All Projects</button>
                <h1 id="dc-project-name" class="text-4xl font-bold text-gray-900"></h1>
                <p id="dc-project-location" class="text-lg text-gray-600 mt-1"></p>
                <p id="dc-report-type" class="text-sm text-gray-500 mt-1 bg-gray-200 inline-block px-2 py-1 rounded"></p>
            </header>

            <div id="main-menu" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div onclick="app.showSection('desk-research')" class="section-card bg-white p-8 rounded-lg shadow-md cursor-pointer border">
                    <h2 class="text-2xl font-semibold">Desk Research</h2>
                    <p class="text-gray-600 mt-2">Background, legislation, methodology, etc.</p>
                </div>
                <div onclick="app.showSection('field-survey')" class="section-card bg-white p-8 rounded-lg shadow-md cursor-pointer border">
                    <h2 class="text-2xl font-semibold">Field Survey</h2>
                    <p class="text-gray-600 mt-2">Habitats, flora, fauna, etc.</p>
                </div>
            </div>

            <div id="desk-research" class="hidden mt-8 bg-white p-8 rounded-lg shadow-lg border">
                <!-- Desk research content will be dynamically generated -->
            </div>
            <div id="field-survey" class="hidden mt-8 bg-white p-8 rounded-lg shadow-lg border">
                <!-- Field survey content -->
            </div>
            <div class="text-center mt-8">
                <button onclick="app.generateReport()" class="bg-indigo-600 text-white px-8 py-3 rounded-lg shadow-lg hover:bg-indigo-700 transition">
                    Generate Report
                </button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="message-modal" class="modal-backdrop hidden"><div class="modal-content"><p id="modal-text"></p><button onclick="app.closeModal('message-modal')" class="mt-4 w-full bg-blue-500 text-white py-2 rounded-md">Close</button></div></div>
    <div id="report-modal" class="modal-backdrop hidden">
        <div id="report-modal-content" class="modal-content flex flex-col">
            <div id="report-controls" class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-2xl font-bold">Generated Report</h3>
                <div>
                    <button onclick="window.print()" class="bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600">Print / Save as PDF</button>
                    <button onclick="app.closeModal('report-modal')" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600 ml-2">Close</button>
                </div>
            </div>
            <div id="report-output" class="flex-grow overflow-y-auto p-4 bg-gray-50"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, onSnapshot, collection, query, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- CONFIG (DO NOT EDIT) ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "AIza...", authDomain: "...", projectId: "..." };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- APP LOGIC ---
        class EcologyApp {
            constructor() {
                this.db = null;
                this.auth = null;
                this.userId = null;
                this.currentProjectId = null;
                this.currentProject = null;
                this.projectUnsub = null;
                this.deskResearchUnsub = null;
                this.fieldEntriesUnsub = {};
                
                this.irishData = {
                    habitats: ['Oak Woodland', 'Wet Heath', 'Blanket Bog', 'Calcareous Grassland', 'Machair', 'Turlough', 'Raised Bog', 'Fen', 'Saltmarsh', 'Sand Dune'],
                    flora: ['Bluebell', "St. Patrick's Cabbage", 'Killarney Fern', 'Bog Asphodel', 'Common Gorse', 'Heather (Ling)', 'Sessile Oak', 'Holly', 'Bilberry', 'Foxglove', 'Primrose'],
                    'fauna-birds': ['Robin', 'Wren', 'Blackbird', 'Peregrine Falcon', 'Meadow Pipit', 'Stonechat', 'Chough', 'Corncrake', 'Hen Harrier', 'Kingfisher', 'Barn Owl'],
                    'fauna-mammals': ['Red Deer', 'Pine Marten', 'Red Squirrel', 'Badger', 'Otter', 'Stoat', 'Pygmy Shrew', "Leisler's Bat", 'Common Seal', 'Grey Seal'],
                    'fauna-invertebrates': ['Green Hairstreak Butterfly', 'Peacock Butterfly', 'Marsh Fritillary', 'Large Red Damselfly', 'White-tailed Bumblebee', 'Freshwater Pearl Mussel', 'Garden Snail'],
                    'invasive-species': ['Rhododendron ponticum', 'Japanese Knotweed', 'Giant Hogweed', 'Himalayan Balsam', 'Grey Squirrel', 'American Mink', 'Zebra Mussel', 'New Zealand Flatworm']
                };

                this.fieldSections = [
                    { id: 'habitats', title: 'Habitats' }, { id: 'flora', title: 'Flora' },
                    { id: 'fauna-birds', title: 'Birds' }, { id: 'fauna-mammals', title: 'Mammals' },
                    { id: 'fauna-invertebrates', title: 'Invertebrates' }, { id: 'invasive-species', title: 'Invasive Species' }
                ];
                
                this.initFirebase();
            }

            async initFirebase() {
                try {
                    const app = initializeApp(firebaseConfig);
                    this.db = getFirestore(app);
                    this.auth = getAuth(app);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(this.auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(this.auth);
                    }
                    this.userId = this.auth.currentUser.uid;
                    this.loadProjects();
                } catch (error) {
                    console.error("Firebase Init Error:", error);
                    this.showModal("Could not connect to the database.");
                }
            }

            // --- NAVIGATION ---
            showView(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            }

            showSection(sectionId) {
                ['desk-research', 'field-survey'].forEach(id => document.getElementById(id).classList.add('hidden'));
                document.getElementById(sectionId).classList.remove('hidden');
            }
            
            goHome() {
                this.currentProjectId = null;
                this.currentProject = null;
                if(this.projectUnsub) this.projectUnsub();
                if(this.deskResearchUnsub) this.deskResearchUnsub();
                Object.values(this.fieldEntriesUnsub).forEach(unsub => unsub());
                this.fieldEntriesUnsub = {};
                this.showView('project-list-view');
            }

            // --- PROJECT MANAGEMENT ---
            loadProjects() {
                const projectsRef = collection(this.db, `artifacts/${appId}/public/data/projects`);
                onSnapshot(query(projectsRef), (snapshot) => {
                    const projectListEl = document.getElementById('project-list');
                    projectListEl.innerHTML = '';
                    if (snapshot.empty) {
                        projectListEl.innerHTML = `<p class="text-gray-500 col-span-full text-center">No projects found. Create one to get started!</p>`;
                    } else {
                        snapshot.forEach(doc => {
                            const project = doc.data();
                            const card = document.createElement('div');
                            card.className = 'project-card bg-white p-6 rounded-lg shadow-md cursor-pointer border';
                            card.innerHTML = `<h3 class="text-xl font-bold text-blue-700">${project.name}</h3><p class="text-gray-600">${project.location}</p><p class="text-xs mt-2 text-gray-500 bg-gray-100 inline-block px-2 py-1 rounded">${project.reportType === 'PEAR' ? 'PEAR' : 'EcIA'}</p>`;
                            card.onclick = () => this.openProject(doc.id);
                            projectListEl.appendChild(card);
                        });
                    }
                });
            }

            async createProject() {
                const name = document.getElementById('project-name').value.trim();
                const location = document.getElementById('project-location').value.trim();
                const description = document.getElementById('project-desc').value.trim();
                const reportType = document.getElementById('report-type').value;

                if (!name || !location) {
                    this.showModal("Project Name and Location are required.");
                    return;
                }
                const projectsRef = collection(this.db, `artifacts/${appId}/public/data/projects`);
                const newProjectRef = await addDoc(projectsRef, { name, location, description, reportType, createdAt: new Date(), ownerId: this.userId });
                
                const deskRef = doc(this.db, `artifacts/${appId}/public/data/projects/${newProjectRef.id}/content/deskResearch`);
                await setDoc(deskRef, { initialized: true });

                this.openProject(newProjectRef.id);
            }

            openProject(projectId) {
                this.currentProjectId = projectId;
                this.showView('data-capture-view');
                
                const projectRef = doc(this.db, `artifacts/${appId}/public/data/projects/${projectId}`);
                this.projectUnsub = onSnapshot(projectRef, (doc) => {
                    this.currentProject = doc.data();
                    document.getElementById('dc-project-name').innerText = this.currentProject.name;
                    document.getElementById('dc-project-location').innerText = this.currentProject.location;
                    document.getElementById('dc-report-type').innerText = this.currentProject.reportType === 'PEAR' ? 'Preliminary Ecological Appraisal Report' : 'Ecological Impact Assessment';
                    this.setupDataCaptureView();
                });
            }

            // --- DATA CAPTURE SETUP ---
            setupDataCaptureView() {
                const reportType = this.currentProject.reportType;

                // Desk Research Setup
                const deskContainer = document.getElementById('desk-research');
                deskContainer.innerHTML = `<h2 class="text-3xl font-bold mb-6 border-b pb-4">Desk Research Data</h2>
                    <div class="space-y-8" id="desk-research-fields"></div>`;
                
                if (reportType === 'PEAR') {
                    this.buildDeskResearchFields_PEAR();
                } else {
                    this.buildDeskResearchFields_EIA();
                }
                this.listenForDeskResearch();

                // Field Survey Setup
                const fieldContainer = document.getElementById('field-survey');
                fieldContainer.innerHTML = `<h2 class="text-3xl font-bold mb-6 border-b pb-4">Field Survey Data (${reportType === 'PEAR' ? 'Section A8' : 'Section 4'})</h2>
                    <div class="space-y-8" id="field-survey-content"></div>`;
                this.buildFieldSections();
                this.fieldSections.forEach(s => this.listenForFieldEntries(s.id));
            }

            // --- DESK RESEARCH BUILDERS ---
            buildDeskResearchFields_EIA() {
                this.buildDynamicDeskFields({
                    '1. Introduction': { background: '1.1. Background', aims: '1.2. Aims and Objectives' },
                    '2. Relevant Legislation and Policy': { legislation_international: '2.1. International Legislation', legislation_national: '2.2. National Legislation & Policy' },
                    '3. Methodology': { method_scope: '3.1. Scope of Project', method_desk: '3.2. Desk Study', method_field: '3.3. Field Surveys' },
                    '5. Impact Assessment & Recommendations': { impact_id: '5.1. High Biodiversity Areas', impact_threats: '5.2. Potential Threats', impact_mitigation: '5.3. Mitigation Measures', impact_timetable: '5.4. Implementation Timetable' },
                    '6. Monitoring': { monitoring_baseline: '6.1. Baseline Data', monitoring_targets: '6.2. Targets', monitoring_schedule: '6.3. Schedule' },
                    '7. References & Further Reading': { references: 'List all references here' }
                });
            }

            buildDeskResearchFields_PEAR() {
                this.buildDynamicDeskFields({
                    'A4. Summary': { summary: 'One page summary of purpose, methodology, key issues, and conclusions.'},
                    'A5. Introduction': { intro_client: 'Client/Commissioner', intro_sitename: 'Site Name', intro_description: 'Brief site description', intro_purpose: 'Purpose of the report' },
                    'A6. Planning Policy and Legislation': { planning_policy: 'Relevant national and local planning policies and legislation.'},
                    'A7.1. Desk Study Methodology': { desk_study_method: 'Websites, reports reviewed, organisations contacted, data requested.'},
                    'A8.1. Designated Sites': { designated_sites: 'Details of all relevant designated sites (SAC, SPA, NHA, etc.).' },
                    'A9. Ecological Constraints & Opportunities': { constraints: 'Identify all ecological constraints', opportunities: 'Identify opportunities for biodiversity gain', further_surveys: 'Describe additional surveys necessary' },
                    'A10. Conclusions': { conclusions: 'Draw justifiable conclusions based on the report content.'},
                    'A11. References': { references: 'List all documents referred to.'}
                });
            }

            buildDynamicDeskFields(fieldConfig) {
                const container = document.getElementById('desk-research-fields');
                container.innerHTML = Object.entries(fieldConfig).map(([title, textareas]) => `
                    <div>
                        <h3 class="text-xl font-semibold mb-2">${title}</h3>
                        <div class="space-y-4 pl-4">
                            ${Object.entries(textareas).map(([id, placeholder]) => `
                                <textarea data-field="${id}" class="w-full p-2 border rounded-md" rows="5" placeholder="${placeholder}"></textarea>
                            `).join('')}
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('textarea').forEach(textarea => {
                    textarea.addEventListener('blur', (e) => this.saveDeskResearchField(e.target.dataset.field, e.target.value));
                });
            }

            saveDeskResearchField(field, value) {
                const deskRef = doc(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/content/deskResearch`);
                updateDoc(deskRef, { [field]: value }).catch(e => console.error("Error updating field:", e));
            }

            listenForDeskResearch() {
                const deskRef = doc(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/content/deskResearch`);
                this.deskResearchUnsub = onSnapshot(deskRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        for (const [field, value] of Object.entries(data)) {
                            const el = document.querySelector(`[data-field="${field}"]`);
                            if (el && el.value !== value) el.value = value;
                        }
                    }
                });
            }

            // --- FIELD SURVEY LOGIC ---
            buildFieldSections() {
                const container = document.getElementById('field-survey-content');
                const fieldSectionTitles = this.currentProject.reportType === 'PEAR' 
                    ? { habitats: 'A8.2. Habitats', species: 'A8.3. Species and species groups' }
                    : { habitats: '4.2. Habitats', species: '4.4. Fauna & 4.3. Flora' };

                container.innerHTML = `
                    <div>
                        <h3 class="text-xl font-semibold mb-2">${fieldSectionTitles.habitats}</h3>
                        <div class="flex justify-between items-center mb-2 pl-4">
                            <p class="text-gray-600">Record habitat types present.</p>
                            <button onclick="app.addFieldEntry('habitats')" class="bg-green-500 text-white px-3 py-1 text-sm rounded-md hover:bg-green-600">+ Add Habitat</button>
                        </div>
                        <div id="habitats-entries" class="space-y-4 pl-4"></div>
                    </div>
                    <div>
                        <h3 class="text-xl font-semibold mb-2">${fieldSectionTitles.species}</h3>
                        ${this.fieldSections.filter(s => s.id !== 'habitats').map(section => `
                            <div class="mt-4">
                                <div class="flex justify-between items-center mb-2 pl-4">
                                    <h4 class="font-semibold text-gray-800">${section.title}</h4>
                                    <button onclick="app.addFieldEntry('${section.id}')" class="bg-green-500 text-white px-3 py-1 text-sm rounded-md hover:bg-green-600">+ Add Entry</button>
                                </div>
                                <div id="${section.id}-entries" class="space-y-4 pl-4"></div>
                            </div>
                        `).join('')}
                    </div>`;
            }

            async addFieldEntry(sectionId) {
                const entriesRef = collection(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/entries`);
                await addDoc(entriesRef, { section: sectionId, type: '', count: '', notes: '', gps: '', createdAt: new Date() });
            }

            async updateFieldEntry(entryId, field, value) {
                const entryRef = doc(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/entries/${entryId}`);
                await updateDoc(entryRef, { [field]: value });
            }

            async deleteFieldEntry(entryId) {
                const entryRef = doc(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/entries/${entryId}`);
                await deleteDoc(entryRef);
            }

            listenForFieldEntries(sectionId) {
                if (this.fieldEntriesUnsub[sectionId]) this.fieldEntriesUnsub[sectionId]();
                const entriesRef = collection(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/entries`);
                this.fieldEntriesUnsub[sectionId] = onSnapshot(query(entriesRef), (snapshot) => {
                    const container = document.getElementById(`${sectionId}-entries`);
                    if (!container) return;
                    container.innerHTML = '';
                    snapshot.docs.filter(doc => doc.data().section === sectionId).forEach(doc => {
                        this.renderFieldEntry(container, doc.id, doc.data());
                    });
                });
            }

            renderFieldEntry(container, entryId, data) {
                 const entryDiv = document.createElement('div');
                entryDiv.id = entryId;
                entryDiv.className = 'data-entry-card bg-gray-50 p-4 rounded-md shadow-sm relative';
                
                const dataList = this.irishData[data.section] || [];
                const options = dataList.map(item => `<option value="${item}" ${data.type === item ? 'selected' : ''}>${item}</option>`).join('');
                const isOther = data.type && !dataList.includes(data.type);

                entryDiv.innerHTML = `
                    <button onclick="app.deleteFieldEntry('${entryId}')" class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Type/Species</label>
                            <select class="w-full p-2 border rounded-md bg-white" data-field="type">
                                <option value="">-- Select --</option>
                                ${options}
                                <option value="other" ${isOther ? 'selected' : ''}>Other (Specify)</option>
                            </select>
                            <input type="text" class="w-full p-2 border rounded-md mt-1 ${isOther ? '' : 'hidden'}" placeholder="Specify other" data-field="other_type" value="${isOther ? data.type : ''}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Count</label>
                            <input type="number" class="w-full p-2 border rounded-md" placeholder="e.g., 5" min="0" data-field="count" value="${data.count || ''}">
                        </div>
                    </div>
                    <label class="block text-sm font-medium text-gray-700 mt-2">Description / Notes</label>
                    <textarea class="w-full p-2 border rounded-md mb-2" rows="3" placeholder="Condition, behavior..." data-field="notes">${data.notes || ''}</textarea>
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="app.getGPS('${entryId}')" class="bg-blue-500 text-white px-3 py-1 text-sm rounded-md">Get GPS</button>
                        <input type="text" class="gps-coords p-1 border rounded-md text-sm" readonly value="${data.gps || ''}">
                    </div>
                `;
                container.appendChild(entryDiv);

                entryDiv.querySelectorAll('[data-field]').forEach(el => {
                    const eventType = el.tagName === 'SELECT' ? 'change' : 'blur';
                    el.addEventListener(eventType, (e) => {
                        let field = e.target.dataset.field;
                        let value = e.target.value;
                        if (field === 'type') {
                            const otherInput = entryDiv.querySelector('[data-field="other_type"]');
                            if (value === 'other') {
                                otherInput.classList.remove('hidden');
                                return; 
                            } else {
                                otherInput.classList.add('hidden');
                                otherInput.value = '';
                            }
                        }
                        if (field === 'other_type') field = 'type';
                        this.updateFieldEntry(entryId, field, value);
                    });
                });
            }
            
            getGPS(entryId) {
                const coordsInput = document.querySelector(`#${entryId} .gps-coords`);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                        coordsInput.value = coords;
                        this.updateFieldEntry(entryId, 'gps', coords);
                    },
                    () => { this.showModal("Could not get GPS location."); }
                );
            }

            // --- REPORTING ---
            async generateReport() {
                const projectRef = doc(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}`);
                const deskRef = doc(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/content/deskResearch`);
                const entriesRef = collection(this.db, `artifacts/${appId}/public/data/projects/${this.currentProjectId}/entries`);

                // FIX: Use getDocs (plural) for collections/queries, not getDoc (singular).
                const [projectSnap, deskSnap, entriesSnap] = await Promise.all([
                    getDoc(projectRef), 
                    getDoc(deskRef), 
                    getDocs(query(entriesRef))
                ]);
                
                const project = projectSnap.data();
                const desk = deskSnap.data();
                
                let reportHTML;
                if (project.reportType === 'PEAR') {
                    reportHTML = this.generatePEAR_HTML(project, desk, entriesSnap);
                } else {
                    reportHTML = this.generateEIA_HTML(project, desk, entriesSnap);
                }

                document.getElementById('report-output').innerHTML = reportHTML;
                this.showModal('report-modal');
            }

            generateEIA_HTML(project, desk, entriesSnap) {
                let html = `<h1 style="font-size: 24px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 8px;">Ecological Impact Assessment</h1>`;
                html += `<p><strong>Project:</strong> ${project.name}</p><p><strong>Location:</strong> ${project.location}</p><p><strong>Date:</strong> ${new Date().toLocaleDateString()}</p><hr style="margin: 16px 0;">`;
                
                const deskContent = [
                    { title: '1. Introduction', fields: { '1.1. Background': desk.background, '1.2. Aims': desk.aims } },
                    { title: '2. Legislation & Policy', fields: { '2.1. International': desk.legislation_international, '2.2. National': desk.legislation_national } },
                    { title: '3. Methodology', fields: { '3.1. Scope': desk.method_scope, '3.2. Desk Study': desk.method_desk, '3.3. Field Surveys': desk.method_field } },
                ];
                html += deskContent.map(s => this.formatSection(s.title, s.fields)).join('');

                html += `<h2 style="font-size: 20px; font-weight: bold; margin-top: 16px;">4. Baseline Ecological Conditions</h2>`;
                html += this.formatFieldSections(entriesSnap);

                const impactContent = [
                     { title: '5. Impact Assessment & Recommendations', fields: { '5.1. High Biodiversity Areas': desk.impact_id, '5.2. Potential Threats': desk.impact_threats, '5.3. Mitigation': desk.impact_mitigation, '5.4. Timetable': desk.impact_timetable } },
                     { title: '6. Monitoring', fields: { '6.1. Baseline': desk.monitoring_baseline, '6.2. Targets': desk.monitoring_targets, '6.3. Schedule': desk.monitoring_schedule } },
                     { title: '7. References', fields: { '': desk.references } },
                ];
                html += impactContent.map(s => this.formatSection(s.title, s.fields)).join('');
                return html;
            }

            generatePEAR_HTML(project, desk, entriesSnap) {
                let html = `<h1 style="font-size: 24px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 8px;">Preliminary Ecological Appraisal Report</h1>`;
                html += `<p><strong>Project:</strong> ${desk.intro_sitename || project.name}</p><p><strong>Client:</strong> ${desk.intro_client || 'N/A'}</p><p><strong>Date:</strong> ${new Date().toLocaleDateString()}</p><hr style="margin: 16px 0;">`;
                
                const deskContent = [
                    { title: 'A4. Summary', fields: { '': desk.summary } },
                    { title: 'A5. Introduction', fields: { 'Site Description': desk.intro_description, 'Purpose of Report': desk.intro_purpose } },
                    { title: 'A6. Planning Policy and Legislation', fields: { '': desk.planning_policy } },
                    { title: 'A7. Methodology', fields: { 'Desk Study': desk.desk_study_method } },
                ];
                html += deskContent.map(s => this.formatSection(s.title, s.fields)).join('');

                html += `<h2 style="font-size: 20px; font-weight: bold; margin-top: 16px;">A8. Baseline Ecological Conditions</h2>`;
                html += this.formatSection('', { 'A8.1. Designated Sites': desk.designated_sites });
                html += this.formatFieldSections(entriesSnap, true);

                const impactContent = [
                     { title: 'A9. Ecological Constraints, Opportunities & Recommendations', fields: { 'Constraints': desk.constraints, 'Opportunities': desk.opportunities, 'Further Surveys Required': desk.further_surveys } },
                     { title: 'A10. Conclusions', fields: { '': desk.conclusions } },
                     { title: 'A11. References', fields: { '': desk.references } },
                ];
                html += impactContent.map(s => this.formatSection(s.title, s.fields)).join('');
                return html;
            }

            formatSection(title, fields) {
                let sectionHTML = title ? `<h2 style="font-size: 20px; font-weight: bold; margin-top: 16px;">${title}</h2>` : '';
                sectionHTML += Object.entries(fields).map(([subtitle, content]) => {
                    let contentHTML = `<p>${(content || 'N/A').replace(/\n/g, '<br>')}</p>`;
                    return subtitle ? `<h3 style="font-size: 16px; font-weight: bold; margin-top: 12px;">${subtitle}</h3>${contentHTML}` : contentHTML;
                }).join('');
                return sectionHTML;
            }

            formatFieldSections(entriesSnap, isPEAR = false) {
                let html = '';
                const sectionPrefix = isPEAR ? 'A8' : '4';
                const sectionTitles = {
                    habitats: `${isPEAR ? 'A8.2' : '4.2'}. Habitats`,
                    flora: `${isPEAR ? 'A8.3' : '4.3'}. Flora`,
                    'fauna-birds': `${isPEAR ? 'A8.3' : '4.4.1'}. Birds`,
                    'fauna-mammals': `${isPEAR ? 'A8.3' : '4.4.2'}. Mammals`,
                    'fauna-invertebrates': `${isPEAR ? 'A8.3' : '4.4.3'}. Invertebrates`,
                    'invasive-species': `${isPEAR ? 'A8.3' : '4.5'}. Invasive Species`
                };

                this.fieldSections.forEach(section => {
                    html += `<h3 style="font-size: 16px; font-weight: bold; margin-top: 12px;">${sectionTitles[section.id]}</h3>`;
                    const sectionEntries = entriesSnap.docs.filter(d => d.data().section === section.id);
                    if (sectionEntries.length > 0) {
                        html += '<ul style="list-style-position: inside; padding-left: 16px;">';
                        sectionEntries.forEach(entryDoc => {
                            const entry = entryDoc.data();
                            html += `<li><strong>${entry.type || 'N/A'}:</strong> ${entry.notes || 'No notes.'} (Count: ${entry.count || 'N/A'}, GPS: ${entry.gps || 'N/A'})</li>`;
                        });
                        html += '</ul>';
                    } else {
                        html += '<p>No data recorded.</p>';
                    }
                });
                return html;
            }

            // --- UTILITIES ---
            showModal(modalIdOrMessage) {
                if (modalIdOrMessage.includes('-modal')) {
                    document.getElementById(modalIdOrMessage).classList.remove('hidden');
                } else {
                    document.getElementById('modal-text').innerText = modalIdOrMessage;
                    document.getElementById('message-modal').classList.remove('hidden');
                }
            }
            closeModal(modalId) {
                document.getElementById(modalId).classList.add('hidden');
            }
        }

        window.app = new EcologyApp();
    </script>
</body>
</html>
